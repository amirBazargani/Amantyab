{% extends "base.html" %}

{% block title %}خطای سرور (۵۰۰) | امانت‌یاب{% endblock %}

{% block content %}
<div class="min-h-[50vh] flex flex-col items-center justify-center text-center px-4">
    <div class="w-20 h-20 bg-red-50 text-red-600 rounded-full flex items-center justify-center mb-6">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
    </div>
    <h1 class="text-6xl font-extrabold text-gray-800 mb-2">۵۰۰</h1>
    <h2 class="text-2xl font-bold text-gray-700 mb-3">خطایی در سرور رخ داده است</h2>
    <p class="text-gray-500 max-w-md mb-8">
        مشکلی در پردازش درخواست شما در سمت سرور پیش آمده است. لطفاً چند لحظه بعد مجدداً تلاش کنید.
    </p>
    <a href="{% url 'core:home' %}" class="inline-flex items-center space-x-2 space-x-reverse bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-xl shadow-sm transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        <span>بازگشت به صفحه اصلی</span>
    </a>
</div>
{% endblock %}
