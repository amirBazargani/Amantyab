{% if messages %}
<div class="space-y-3 mb-6" id="messages-container">
    {% for message in messages %}
        <div class="flex items-center justify-between p-4 rounded-xl border text-sm font-medium transition-all shadow-sm
            {% if message.tags == 'error' %}
                bg-red-50 text-red-800 border-red-200
            {% elif message.tags == 'success' %}
                bg-green-50 text-green-800 border-green-200
            {% elif message.tags == 'warning' %}
                bg-amber-50 text-amber-800 border-amber-200
            {% else %}
                bg-blue-50 text-blue-800 border-blue-200
            {% endif %}
        " role="alert">
            <div class="flex items-center space-x-3 space-x-reverse">
                {% if message.tags == 'error' %}
                    <svg class="w-5 h-5 text-red-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                {% elif message.tags == 'success' %}
                    <svg class="w-5 h-5 text-green-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                {% elif message.tags == 'warning' %}
                    <svg class="w-5 h-5 text-amber-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                {% else %}
                    <svg class="w-5 h-5 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                {% endif %}
                <span>{{ message }}</span>
            </div>
            <button type="button" onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600 focus:outline-none p-1 rounded-md">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    {% endfor %}
</div>
{% endif %}
