<div class="space-y-1">
    {% if field.field.widget.input_type == "checkbox" %}
        <div class="flex items-center space-x-2 space-x-reverse">
            {{ field }}
            <label for="{{ field.id_for_label }}" class="text-sm text-gray-700 select-none cursor-pointer">
                {{ label|default:field.label }}
                {% if field.field.required %}<span class="text-red-500">*</span>{% endif %}
            </label>
        </div>
    {% else %}
        {% if field.label %}
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700">
                {{ label|default:field.label }}
                {% if field.field.required %}
                    <span class="text-red-500">*</span>
                {% endif %}
            </label>
        {% endif %}
        {{ field }}
    {% endif %}

    {% if field.errors %}
        <p class="text-xs text-red-600 mt-1">{{ field.errors.0 }}</p>
    {% elif help_text or field.help_text %}
        <p class="text-xs text-gray-500 mt-1">{{ help_text|default:field.help_text }}</p>
    {% endif %}
</div>
