<div class="bg-white rounded-3xl border border-gray-200 p-10 sm:p-12 text-center max-w-lg mx-auto shadow-sm my-8 space-y-4">
    <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
        {% if icon == 'box' %}
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
        {% elif icon == 'rental' %}
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
        {% elif icon == 'users' %}
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        {% else %}
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        {% endif %}
    </div>

    <div>
        <h3 class="text-lg font-bold text-gray-900 mb-1">{{ title|default:"موردی یافت نشد" }}</h3>
        <p class="text-xs sm:text-sm text-gray-500 max-w-sm mx-auto leading-relaxed">
            {{ message|default:"در حال حاضر اطلاعاتی برای نمایش در این بخش وجود ندارد." }}
        </p>
    </div>

    {% if action_url and action_text %}
        <div class="pt-2">
            <a href="{{ action_url }}" class="inline-flex items-center space-x-1.5 space-x-reverse px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-medium rounded-xl shadow-sm transition">
                <span>{{ action_text }}</span>
            </a>
        </div>
    {% endif %}
</div>
